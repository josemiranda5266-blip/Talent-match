name: Production input hardening

on:
  push:
    branches: [production-hardening]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening
          fetch-depth: 1
      - name: Patch server validation
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.ts')
          s=p.read_text(encoding='utf-8')
          old="rejectUnimplementedCancellation, calculateCouponPrice, resolveCanonicalBasePrice"
          new="rejectUnimplementedCancellation, calculateCouponPrice, resolveCanonicalBasePrice, validateMercadoPagoInput"
          if old in s and new not in s:
              s=s.replace(old,new,1)
          old_route="app.use('/api/mercadopago/validate-coupon', requireFirebaseUser);"
          new_route="app.use('/api/mercadopago/validate-coupon', requireFirebaseUser, validateMercadoPagoInput);"
          if old_route in s: s=s.replace(old_route,new_route,1)
          old_route="app.use('/api/mercadopago/create-preference', requireFirebaseUser, requireMercadoPagoCredential, enforceServerPrice, rejectSimulatedPreferenceResponse);"
          new_route="app.use('/api/mercadopago/create-preference', requireFirebaseUser, validateMercadoPagoInput, requireMercadoPagoCredential, enforceServerPrice, rejectSimulatedPreferenceResponse);"
          if old_route in s: s=s.replace(old_route,new_route,1)
          old_route="app.use('/api/mercadopago/verify-payment', requireFirebaseUser, requireMercadoPagoCredential, verifyPaymentAgainstMercadoPago);"
          new_route="app.use('/api/mercadopago/verify-payment', requireFirebaseUser, validateMercadoPagoInput, requireMercadoPagoCredential, verifyPaymentAgainstMercadoPago);"
          if old_route in s: s=s.replace(old_route,new_route,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and build
        run: |
          if grep -R -n --exclude-dir=.git --exclude-dir=node_modules 'aiFallbackProfile' server.ts; then exit 1; fi
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git rm .github/workflows/production-input-hardening.yml
          git diff --cached --quiet && exit 0
          git commit -m 'security: validate Mercado Pago request inputs'
          git push origin HEAD:production-hardening
