name: Canonical Mercado Pago URL hardening

on:
  push:
    branches:
      - production-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical public URL handling
        shell: python
        run: |
          from pathlib import Path

          p = Path('server.ts')
          text = p.read_text()

          helper = '''\nfunction getPublicAppUrl(req: any): string {\n  const configured = String(process.env.PUBLIC_APP_URL || '').trim().replace(/\\/+$/, '');\n  if (configured) {\n    let parsed: URL;\n    try { parsed = new URL(configured); } catch { throw new Error('PUBLIC_APP_URL is invalid'); }\n    if (parsed.protocol !== 'https:') throw new Error('PUBLIC_APP_URL must use HTTPS');\n    return configured;\n  }\n  if (process.env.NODE_ENV === 'production') {\n    throw new Error('PUBLIC_APP_URL is required in production');\n  }\n  const host = req.get('host');\n  if (!host) throw new Error('Unable to determine development host');\n  return `${req.protocol}://${host}`;\n}\n'''

          marker = "const PORT = Number(process.env.PORT) || 8080;"
          if "function getPublicAppUrl(req: any)" not in text:
              if marker not in text:
                  raise SystemExit('PORT marker not found')
              text = text.replace(marker, marker + helper, 1)

          replacements = 0
          replacements += text.count("const notificationUrl=`${req.protocol}://${req.get('host')}/api/mercadopago/webhook`;")
          text = text.replace(
              "const notificationUrl=`${req.protocol}://${req.get('host')}/api/mercadopago/webhook`;",
              "const publicAppUrl=getPublicAppUrl(req);const notificationUrl=`${publicAppUrl}/api/mercadopago/webhook`;",
          )
          replacements += text.count("const backUrl=`${req.protocol}://${req.get('host')}?payment_status=approved`;")
          text = text.replace(
              "const backUrl=`${req.protocol}://${req.get('host')}?payment_status=approved`;",
              "const backUrl=`${publicAppUrl}?payment_status=approved`;",
          )
          replacements += text.count("failure:`${req.protocol}://${req.get('host')}?payment_status=failure`")
          text = text.replace(
              "failure:`${req.protocol}://${req.get('host')}?payment_status=failure`",
              "failure:`${publicAppUrl}?payment_status=failure`",
          )

          if replacements != 3:
              raise SystemExit(f'Expected 3 Mercado Pago URL replacements, got {replacements}')

          p.write_text(text)
          print(f'Replaced {replacements} Mercado Pago callback URL constructions')

      - name: Verify canonical URL enforcement
        shell: python
        run: |
          from pathlib import Path
          text = Path('server.ts').read_text()
          assert text.count('function getPublicAppUrl(req: any)') == 1
          assert text.count('getPublicAppUrl(req)') >= 1
          assert 'PUBLIC_APP_URL' in text
          assert "req.get('host')" in text
          assert 'const notificationUrl=`${publicAppUrl}/api/mercadopago/webhook`;' in text
          assert 'back_urls:{success:backUrl,pending:backUrl,failure:`${publicAppUrl}?payment_status=failure`}' in text
          assert "const notificationUrl=`${req.protocol}://${req.get('host')}/api/mercadopago/webhook`;" not in text
          assert "const backUrl=`${req.protocol}://${req.get('host')}?payment_status=approved`;" not in text
          print('Canonical PUBLIC_APP_URL enforcement verified')

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Quality gate
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run typecheck

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix: use canonical public URL for Mercado Pago callbacks"
          git rm .github/workflows/canonical-public-url.yml
          git commit -m "chore: remove temporary URL hardening workflow"
          git push origin production-hardening