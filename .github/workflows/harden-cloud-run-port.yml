name: Harden Cloud Run port handling

on:
  workflow_dispatch:
  push:
    branches: [production-hardening]

permissions:
  contents: write

jobs:
  patch-port:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production-hardening
        uses: actions/checkout@v4
        with:
          ref: production-hardening
          fetch-depth: 0

      - name: Patch Cloud Run port handling
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server.ts')
          text = path.read_text(encoding='utf-8')

          old = 'const PORT = 3000;'
          new = 'const PORT = Number(process.env.PORT) || 8080;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected PORT declaration was not found; refusing an unsafe edit.')

          text2 = re.sub(r'app\.listen\(\s*3000\b', 'app.listen(PORT', text, count=1)
          text2 = re.sub(r'app\.listen\(\s*Number\(process\.env\.PORT\)\s*\|\|\s*8080', 'app.listen(PORT', text2, count=1)
          text = text2

          if 'app.listen(PORT' not in text:
              raise SystemExit('server.ts does not expose app.listen(PORT); refusing to claim Cloud Run readiness.')

          path.write_text(text, encoding='utf-8')

      - name: Verify patch
        run: |
          grep -n "const PORT" server.ts
          grep -n "app.listen(PORT" server.ts

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git rm .github/workflows/harden-cloud-run-port.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "fix(cloud-run): honor injected PORT"
          git push origin HEAD:production-hardening
