name: Verify hardening

on:
  push:
    branches: [production-hardening]

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies and refresh lockfile
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Remove verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-hardening.yml
          git add bun.lock
          git commit -m "chore: verify production hardening"
          git push origin HEAD:production-hardening
