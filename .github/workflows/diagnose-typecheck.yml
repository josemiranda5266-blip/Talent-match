name: Diagnose typecheck

on:
  push:
    branches: [production-hardening]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Capture typecheck diagnostics
        run: |
          set +e
          bun run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cp /tmp/typecheck.log TYPECHECK_FAILURE.txt
          echo "TYPECHECK_STATUS=$status" >> TYPECHECK_FAILURE.txt
          exit 0
      - name: Commit diagnostics and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TYPECHECK_FAILURE.txt
          git rm .github/workflows/diagnose-typecheck.yml
          git commit -m "chore: capture typecheck diagnostics"
          git push origin HEAD:production-hardening
