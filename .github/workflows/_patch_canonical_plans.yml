name: Temporary canonical plan hardening

on:
  push:
    paths:
      - '.github/workflows/_patch_canonical_plans.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening

      - name: Patch canonical Mercado Pago plans
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mercadopago-security.ts')
          s = p.read_text()
          s = s.replace("const ALLOWED_PLAN_PRICES_ARS = new Set([14900, 49900, 129000]);", "const CANONICAL_PLANS = new Map<string, { priceArs: number; name: string }>([\n  ['plan-ath-pro', { priceArs: 4990, name: 'PRO Deportista' }],\n  ['plan-club-pro', { priceArs: 19900, name: 'PRO Club' }],\n]);\nconst ALLOWED_PLAN_PRICES_ARS = new Set([...CANONICAL_PLANS.values()].map(plan => plan.priceArs));\n\nexport function getCanonicalPlan(planId: unknown): { id: string; priceArs: number; name: string } | null {\n  if (typeof planId !== 'string') return null;\n  const id = planId.trim();\n  const plan = CANONICAL_PLANS.get(id);\n  return plan ? { id, ...plan } : null;\n}")
          old = "export function enforceServerPrice(req: any, res: any, next: any) {\n  const price = Number(req.body?.priceMonthly);\n  const coupon = normalizeCoupon(req.body?.couponCode);\n  if (!Number.isSafeInteger(price) || !ALLOWED_PLAN_PRICES_ARS.has(price)) return res.status(400).json({ error: 'Plan o precio no autorizado por el servidor.' });\n  if (req.body?.userId && req.body.userId !== req.user?.uid) return res.status(403).json({ error: 'El usuario del pago no coincide con la sesión autenticada.' });\n  req.body.userId = req.user.uid;\n  req.body.userEmail = req.user.email || undefined;\n  req.body.priceMonthly = price;\n  if (coupon && !COUPON_DISCOUNTS.has(coupon)) return res.status(400).json({ error: 'Cupón no autorizado.' });\n  return next();\n}"
          new = "export function enforceServerPrice(req: any, res: any, next: any) {\n  const plan = getCanonicalPlan(req.body?.planId);\n  const coupon = normalizeCoupon(req.body?.couponCode);\n  if (!plan) return res.status(400).json({ error: 'Plan no autorizado por el servidor.' });\n  if (req.body?.userId && req.body.userId !== req.user?.uid) return res.status(403).json({ error: 'El usuario del pago no coincide con la sesión autenticada.' });\n  req.body.userId = req.user.uid;\n  req.body.userEmail = req.user.email || undefined;\n  req.body.planId = plan.id;\n  req.body.planName = plan.name;\n  req.body.priceMonthly = plan.priceArs;\n  if (coupon && !COUPON_DISCOUNTS.has(coupon)) return res.status(400).json({ error: 'Cupón no autorizado.' });\n  return next();\n}"
          if old not in s:
              raise SystemExit('enforceServerPrice block not found')
          s = s.replace(old, new)
          old = "    const coupon = normalizeCoupon(reference.coupon);\n    const canonicalBasePrice = resolveCanonicalBasePrice(referencedPrice, coupon);"
          new = "    const referencePlan = getCanonicalPlan(reference.planId);\n    if (!referencePlan || referencePlan.priceArs !== resolveCanonicalBasePrice(referencedPrice, reference.coupon)) return res.status(403).json({ error: 'El plan del pago no corresponde a un plan autorizado.' });\n    const coupon = normalizeCoupon(reference.coupon);\n    const canonicalBasePrice = referencePlan.priceArs;"
          if old not in s:
              raise SystemExit('verification block not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('server.ts')
          s = p.read_text()
          s = s.replace("import { requireFirebaseUser, verifyMercadoPagoWebhook, recordWebhookIdempotency, requireMercadoPagoCredential, enforceServerPrice, rejectSimulatedPreferenceResponse, verifyPaymentAgainstMercadoPago, rejectUnimplementedCancellation, calculateCouponPrice, resolveCanonicalBasePrice } from './mercadopago-security.ts';", "import { requireFirebaseUser, verifyMercadoPagoWebhook, recordWebhookIdempotency, requireMercadoPagoCredential, enforceServerPrice, rejectSimulatedPreferenceResponse, verifyPaymentAgainstMercadoPago, rejectUnimplementedCancellation, calculateCouponPrice, resolveCanonicalBasePrice, getCanonicalPlan } from './mercadopago-security.ts';")
          old = "app.post('/api/mercadopago/validate-coupon',(req,res)=>{const{code}=req.body;if(!code)return res.status(400).json({error:'Código no proporcionado.'});const cleanCode=String(code).trim().toUpperCase();const canonicalPrices=[14900,49900,129000];const numericPrice=Number(req.body?.originalPrice);if(!Number.isSafeInteger(numericPrice)||!canonicalPrices.includes(numericPrice))return res.status(400).json({error:'Precio de plan inválido.'});const discounts:Record<string,number>={PROMO50:50,ARGENTINA50:50,PRO2025:30,CLUB30:30};const discountPercent=discounts[cleanCode];if(discountPercent===undefined)return res.status(404).json({valid:false,error:'Cupón no válido o expirado.'});const finalPriceVal=Math.max(0,Math.round(numericPrice*(1-discountPercent/100)));res.json({valid:true,code:cleanCode,discountPercent,description:discountPercent===50?'Descuento del 50% en tu primera suscripción':'Descuento del 30% en planes autorizados',originalPrice:`$${numericPrice.toLocaleString('es-AR')} ARS`,finalPrice:`$${finalPriceVal.toLocaleString('es-AR')} ARS`,finalPriceNumeric:finalPriceVal});});"
          new = "app.post('/api/mercadopago/validate-coupon',(req,res)=>{const{code,planId}=req.body;const plan=getCanonicalPlan(planId);if(!code)return res.status(400).json({error:'Código no proporcionado.'});if(!plan)return res.status(400).json({error:'Plan inválido.'});const cleanCode=String(code).trim().toUpperCase();const discounts:Record<string,number>={PROMO50:50,ARGENTINA50:50,PRO2025:30,CLUB30:30};const discountPercent=discounts[cleanCode];if(discountPercent===undefined)return res.status(404).json({valid:false,error:'Cupón no válido o expirado.'});const finalPriceVal=Math.max(0,Math.round(plan.priceArs*(1-discountPercent/100)));res.json({valid:true,code:cleanCode,planId:plan.id,planName:plan.name,discountPercent,description:discountPercent===50?'Descuento del 50% en tu primera suscripción':'Descuento del 30% en planes autorizados',originalPrice:`$${plan.priceArs.toLocaleString('es-AR')} ARS`,finalPrice:`$${finalPriceVal.toLocaleString('es-AR')} ARS`,finalPriceNumeric:finalPriceVal});});"
          if old not in s:
              raise SystemExit('coupon handler not found')
          s = s.replace(old, new)
          old = "app.post('/api/mercadopago/create-preference',async(req,res)=>{try{const{planId,planName,priceMonthly,userEmail,userId,couponCode}=req.body;const numericPrice=parseFloat(String(priceMonthly).replace(/[^0-9.]/g,''))||14900;let finalPrice=numericPrice;let appliedCoupon=null;if(couponCode){const c=String(couponCode).trim().toUpperCase();if(['TALENT100','PROMO100'].includes(c)){finalPrice=0;appliedCoupon=c;}else if(['PROMO50','ARGENTINA50'].includes(c)){finalPrice=Math.round(numericPrice*.5);appliedCoupon=c;}else if(['PRO2025','CLUB30'].includes(c)){finalPrice=Math.round(numericPrice*.7);appliedCoupon=c;}}if(finalPrice===0)return res.status(400).json({error:'El cupón bonificado requiere un flujo de activación promocional seguro y no genera una preferencia de pago.'});"
          new = "app.post('/api/mercadopago/create-preference',async(req,res)=>{try{const{planId,planName,priceMonthly,userEmail,userId,couponCode}=req.body;const plan=getCanonicalPlan(planId);if(!plan)return res.status(400).json({error:'Plan no autorizado por el servidor.'});const numericPrice=plan.priceArs;const couponResult=calculateCouponPrice(numericPrice,couponCode);const finalPrice=couponResult.finalPrice;const appliedCoupon=couponResult.coupon;"
          if old not in s:
              raise SystemExit('create preference pricing block not found')
          s = s.replace(old, new)
          s = s.replace("external_reference:JSON.stringify({userId,planId,planName,price:finalPrice,coupon:appliedCoupon})", "external_reference:JSON.stringify({userId,planId:plan.id,planName:plan.name,price:finalPrice,basePrice:plan.priceArs,coupon:appliedCoupon})")
          p.write_text(s)
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mercadopago-security.ts server.ts
          git commit -m 'security: canonicalize Mercado Pago subscription plans' || exit 0
          git push origin production-hardening

      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin production-hardening
          git checkout production-hardening
          git pull --ff-only origin production-hardening
          git rm .github/workflows/_patch_canonical_plans.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary canonical plan workflow' || true
          git push origin production-hardening || true
