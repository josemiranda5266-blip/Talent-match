name: Hardening cleanup
on:
  push:
    branches: [production-hardening]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Remove synthetic user metrics and dead coupon path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          start = "const seedUserStats:UserCostRecord[]=["
          end = "seedUserStats.forEach(u=>userCostMap.set(u.userId,u));"
          a = s.index(start)
          b = s.index(end, a) + len(end)
          s = s[:a] + "// Production user-cost metrics start empty and are populated only by real runtime activity.\n" + s[b:]
          old = "const{code,originalPrice}=req.body;if(!code)return res.status(400).json({error:'Código no proporcionado.'});const cleanCode=String(code).trim().toUpperCase();let discountPercent=0;let description='';if(['TALENT100','PROMO100'].includes(cleanCode)){discountPercent=100;description='Cupón Especial 100% Bonificado (Acceso Gratuito de Prueba)';}else if(['PROMO50','ARGENTINA50'].includes(cleanCode)){discountPercent=50;description='Descuento del 50% en tu primera suscripción';}else if(['PRO2025','CLUB30'].includes(cleanCode)){discountPercent=30;description='Descuento del 30% en planes anuales/mensuales';}else if(cleanCode==='TALENT20'){discountPercent=20;description='Descuento de bienvenida del 20%';}else return res.status(404).json({valid:false,error:'Cupón no válido o expirado.'});const numericPrice=parseFloat(String(originalPrice).replace(/[^0-9.]/g,''))||14900;const finalPriceVal=Math.max(0,Math.round(numericPrice*(1-discountPercent/100)));res.json({valid:true,code:cleanCode,discountPercent,description,originalPrice:`$${numericPrice.toLocaleString('es-AR')} ARS`,finalPrice:`$${finalPriceVal.toLocaleString('es-AR')} ARS`,finalPriceNumeric:finalPriceVal});"
          new = "const{code}=req.body;if(!code)return res.status(400).json({error:'Código no proporcionado.'});const cleanCode=String(code).trim().toUpperCase();const canonicalPrices=[14900,49900,129000];const numericPrice=Number(req.body?.originalPrice);if(!Number.isSafeInteger(numericPrice)||!canonicalPrices.includes(numericPrice))return res.status(400).json({error:'Precio de plan inválido.'});const discounts:Record<string,number>={PROMO50:50,ARGENTINA50:50,PRO2025:30,CLUB30:30};const discountPercent=discounts[cleanCode];if(discountPercent===undefined)return res.status(404).json({valid:false,error:'Cupón no válido o expirado.'});const finalPriceVal=Math.max(0,Math.round(numericPrice*(1-discountPercent/100)));res.json({valid:true,code:cleanCode,discountPercent,description:discountPercent===50?'Descuento del 50% en tu primera suscripción':'Descuento del 30% en planes autorizados',originalPrice:`$${numericPrice.toLocaleString('es-AR')} ARS`,finalPrice:`$${finalPriceVal.toLocaleString('es-AR')} ARS`,finalPriceNumeric:finalPriceVal});"
          if old not in s:
            raise SystemExit('coupon handler pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'chore: remove synthetic production metrics' || true
          git push origin production-hardening
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/hardening-cleanup.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary hardening workflow' || true
          git push origin production-hardening || true
