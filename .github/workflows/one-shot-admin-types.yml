name: One-shot admin type cleanup

on:
  push:
    branches: [production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe admin model fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/AdminPanelView.tsx')
          s = p.read_text()
          replacements = {
            "fraudAlerts.filter(f => f.status === 'detected' || f.status === 'under_review')": "fraudAlerts.filter(f => f.status === 'active' || f.status === 'investigating')",
            "reports.filter(r => r.status === 'open')": "reports.filter(r => r.status === 'pending')",
            "reports.filter(r => r.status === 'open' || r.status === 'pending')": "reports.filter(r => r.status === 'pending' || r.status === 'investigating')",
            "{req.documentType || 'DNI Frente / Dorso'}": "{req.dniNumber || 'DNI / documentación'}",
            "{req.documentUrl && (": "{req.dniDocumentUrl && (",
            "href={req.documentUrl}": "href={req.dniDocumentUrl}",
            "{appeal.appealText}": "{appeal.appealMessage}",
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s)
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminPanelView.tsx
          git rm .github/workflows/one-shot-admin-types.yml
          git commit -m "fix(types): align admin moderation models"
          git push
