name: Temporary proxy hardening
on:
  push:
    branches: [production-hardening]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Patch Cloud Run proxy handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old = "const app = express();\nconst PORT = Number(process.env.PORT) || 8080;"
          new = "const app = express();\n// Cloud Run terminates TLS at the proxy; trust the single managed proxy hop so req.protocol is HTTPS.\napp.set('trust proxy', 1);\nconst PORT = Number(process.env.PORT) || 8080;"
          if old not in s:
              raise SystemExit('Expected server.ts anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Commit and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(cloud-run): trust managed proxy for secure callback URLs"
          git rm .github/workflows/proxy-hardening.yml
          git commit -m "chore: remove temporary proxy hardening workflow"
          git push origin HEAD:production-hardening
