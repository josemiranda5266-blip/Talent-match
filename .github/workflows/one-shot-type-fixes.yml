name: One-shot type fixes

on:
  push:
    branches:
      - production-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safe type fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          for name in [
              'src/components/CandidateModal.tsx',
              'src/components/ChatModal.tsx',
              'src/components/TeamsDirectoryView.tsx',
          ]:
              path = Path(name)
              text = path.read_text()
              fixed = re.sub(
                  r'<([A-Z][A-Za-z0-9]*)\\b([^>]*?)\\s+title="([^"]+)"([^>]*)>',
                  r'<\\1\\2 aria-label="\\3"\\4>',
                  text,
              )
              if fixed != text:
                  path.write_text(fixed)

          path = Path('src/services/firebaseServiceLegacy.ts')
          text = path.read_text()
          text = text.replace("displayName: displayName || email.split('@')[0],", "displayName: displayName || email.split('@')[0] || email,")
          text = text.replace(
              "const referrerDoc = snap.docs[0];\n    const referrerData = referrerDoc.data() as UserGrowthProfile;",
              "const referrerDoc = snap.docs[0];\n    if (!referrerDoc) {\n      return { success: false, message: 'El código de referido no existe o venció.' };\n    }\n    const referrerData = referrerDoc.data() as UserGrowthProfile;",
          )
          path.write_text(text)

          path = Path('src/App.tsx')
          text = path.read_text()
          text = text.replace(
              "const [currentAthlete, setCurrentAthlete] = useState<Athlete>(demoActive ? INITIAL_ATHLETES[0] : ({} as Athlete));",
              "const [currentAthlete, setCurrentAthlete] = useState<Athlete>(demoActive ? (INITIAL_ATHLETES[0] || ({} as Athlete)) : ({} as Athlete));",
          )
          text = text.replace(
              "      if (athList.length) {\n        setCurrentAthlete(athList[0]);\n      }",
              "      const firstAthlete = athList[0];\n      if (firstAthlete) {\n        setCurrentAthlete(firstAthlete);\n      }",
          )
          text = text.replace(
              "        if (INITIAL_ATHLETES.length) setCurrentAthlete(INITIAL_ATHLETES[0]);",
              "        const firstDemoAthlete = INITIAL_ATHLETES[0];\n        if (firstDemoAthlete) setCurrentAthlete(firstDemoAthlete);",
          )
          text = text.replace(
              "appliedAt: new Date().toISOString().split('T')[0],",
              "appliedAt: new Date().toISOString().split('T')[0] || '',",
          )
          text = text.replace(
              "        userRole={currentRole}",
              "        userRole={currentRole === 'admin' ? 'club' : currentRole}",
          )
          path.write_text(text)

      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CandidateModal.tsx src/components/ChatModal.tsx src/components/TeamsDirectoryView.tsx src/services/firebaseServiceLegacy.ts src/App.tsx
          git rm .github/workflows/one-shot-type-fixes.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(types): remove remaining unsafe component props"
            git push
          fi
