name: One-shot TypeScript hardening

on:
  push:
    branches: [production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply safe TypeScript fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              n = fn(s)
              if n != s:
                  p.write_text(n)
                  print('updated', path)

          edit('src/components/AdminPanelView.tsx', lambda s: s
              .replace("=== 'atleta'", "=== 'athlete'")
              .replace("=== 'open'", "=== 'pending'")
              .replace("=== 'detected'", "=== 'active'")
              .replace("=== 'under_review'", "=== 'investigating'")
              .replace('.documentType', '.dniNumber')
              .replace('.documentUrl', '.dniDocumentUrl')
              .replace('.appealText', '.appealMessage')
              .replace('.reportedName', '.reporterName')
              .replace('.reportedId', '.reporterId')
          )

          for f in ['src/components/CandidateModal.tsx','src/components/ChatModal.tsx','src/components/TeamsDirectoryView.tsx']:
              edit(f, lambda s: re.sub(r'\s+title=("[^"]*"|\{[^}]*\})', '', s))

          edit('src/components/ChatModal.tsx', lambda s: s.replace('messages[messages.length - 1].', 'messages[messages.length - 1]?.'))

          for f in ['src/components/CreateSearchModal.tsx','src/components/AthleteView.tsx','src/components/TeamsDirectoryView.tsx','src/components/TalentRadarModal.tsx','src/components/TournamentsView.tsx']:
              edit(f, lambda s: s.replace("new Date().toISOString().split('T')[0]", "new Date().toISOString().split('T')[0] ?? new Date().toISOString()"))

          edit('src/components/TalentRadarModal.tsx', lambda s: s.replace('<option key={s} value={s}>{s}</option>', '<option key={s.name} value={s.name}>{s.name}</option>'))
          edit('src/components/ClubView.tsx', lambda s: s.replace('openCandidateModal(selectedAthlete);', 'if (selectedAthlete) openCandidateModal(selectedAthlete);'))
          edit('src/components/SmartFeedView.tsx', lambda s: re.sub(r'\bathleteObj\.([A-Za-z_$][\w$]*)', r'athleteObj?.\1', s))
          edit('src/components/OnboardingModal.tsx', lambda s: s.replace('const currentData = onboardingData[currentStep];', 'const currentData = onboardingData[currentStep] ?? {};'))
          edit('src/components/ReviewsAndReferencesModal.tsx', lambda s: s.replace('user.avatar', "(user as UserProfile & { avatar?: string }).avatar"))
          PY

          bun install --frozen-lockfile
          set +e
          bun run typecheck
          status=$?
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'fix(types): apply strict TypeScript hardening batch'
            git push
          fi
          exit $status
