name: One-shot TypeScript hardening

on:
  push:
    branches: [production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply final strict TypeScript fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/AdminPanelView.tsx')
          s = p.read_text()
          s = s.replace("onClick={() => handleSuspendAccount(alert.targetUserId, alert.targetUserName)}", "onClick={() => { if (alert.targetUserId) handleSuspendAccount(alert.targetUserId, alert.targetUserName || 'Usuario'); }}")
          p.write_text(s)
          PY

          bun install --frozen-lockfile
          set +e
          bun run typecheck
          status=$?
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdminPanelView.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix(types): guard optional fraud target identifiers'
            git push
          fi
          exit $status
