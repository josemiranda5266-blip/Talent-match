name: One-shot TypeScript hardening

on:
  push:
    branches: [production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply strict TypeScript fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              n = fn(s)
              if n != s:
                  p.write_text(n)
                  print('updated', path)

          edit('src/components/AdminPanelView.tsx', lambda s: s
              .replace('alert.type', "(alert as FraudAlert & { type?: string }).type")
              .replace('rep.reportedUserId || rep.reporterId', 'rep.reportedUserId')
              .replace('onClick={() => handleResolveFraudAlert(alert.id)}', "onClick={() => { if (alert.id) handleResolveFraudAlert(alert.id); }}")
          )

          edit('src/components/AthleteView.tsx', lambda s: s
              .replace('Array.from(new Set([...updatedStats.achievements, ...data.keyAchievements]))', 'Array.from(new Set([...(updatedStats.achievements ?? []), ...data.keyAchievements]))')
              .replace('const updatedStats = { ...formData.stats };', "const updatedStats = {\n      matchesPlayed: formData.stats?.matchesPlayed ?? 0,\n      goalsOrPoints: formData.stats?.goalsOrPoints ?? 0,\n      assists: formData.stats?.assists,\n      minutesPlayed: formData.stats?.minutesPlayed,\n      achievements: formData.stats?.achievements ?? [],\n    };")
          )

          edit('src/components/ChatModal.tsx', lambda s: s.replace('setActiveConversationId(list[0].id);', 'setActiveConversationId(list[0]?.id ?? null);'))

          edit('src/components/ClubView.tsx', lambda s: s.replace(
              'onInviteCandidate={(athId) => {\n          onOpenCandidateModal(athletes.find(a => a.id === athId) || athletes[0]);\n        }}',
              'onInviteCandidate={(athId) => {\n          const candidate = athletes.find(a => a.id === athId);\n          if (candidate) onOpenCandidateModal(candidate);\n        }}'
          ))

          edit('src/components/OnboardingModal.tsx', lambda s: s.replace('const currentData = steps[currentStep];', 'const currentData = steps[currentStep] ?? steps[0];'))

          edit('src/components/ReviewsAndReferencesModal.tsx', lambda s: s.replace('currentUser.avatar', "(currentUser as UserProfile & { avatar?: string }).avatar"))

          edit('src/components/SmartFeedView.tsx', lambda s: s.replace(
              'const athleteObj = currentAthlete || allCandidates[0];\n',
              'const athleteObj = currentAthlete || allCandidates[0];\n  if (!athleteObj) return null;\n'
          ))

          edit('src/components/TournamentsView.tsx', lambda s: s
              .replace('PRESET_BANNERS[0].url', "PRESET_BANNERS[0]?.url ?? ''")
              .replace('t.contactWhatsApp.replace(', "(t.contactWhatsApp ?? '').replace(")
              .replace('selectedTournamentDetail.contactWhatsApp.replace(', "(selectedTournamentDetail.contactWhatsApp ?? '').replace(")
              .replace('contactWhatsApp})', "contactWhatsApp ?? ''})")
          )
          PY

          bun install --frozen-lockfile
          set +e
          bun run typecheck
          status=$?
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'fix(types): close remaining strict component errors'
            git push
          fi
          exit $status
