name: One-shot TypeScript hardening

on:
  push:
    branches: [production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply final strict TypeScript fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              n = fn(s)
              if n != s:
                  p.write_text(n)
                  print('updated', path)

          edit('src/components/AdminPanelView.tsx', lambda s: s
              .replace("onClick={() => handleSuspendAccount(rep.reportedUserId, rep.reporterName || 'Usuario')}", "onClick={() => { if (rep.reportedUserId) handleSuspendAccount(rep.reportedUserId, rep.reporterName || 'Usuario'); }}")
              .replace("onClick={() => handleBanAccount(rep.reportedUserId, rep.reporterName || 'Usuario')}", "onClick={() => { if (rep.reportedUserId) handleBanAccount(rep.reportedUserId, rep.reporterName || 'Usuario'); }}")
          )

          edit('src/components/OnboardingModal.tsx', lambda s: s.replace('const currentData = steps[currentStep] ?? steps[0];', 'const currentData = steps[currentStep] ?? steps[0]!;'))

          edit('src/components/TournamentsView.tsx', lambda s: s
              .replace("bannerImage: bannerImage || PRESET_BANNERS[0]?.url ?? ''", "bannerImage: bannerImage || (PRESET_BANNERS[0]?.url ?? '')")
              .replace("startDate: startDate || new Date().toISOString().split('T')[0] ?? new Date().toISOString() ?? new Date().toISOString()", "startDate: startDate || (new Date().toISOString().split('T')[0] ?? new Date().toISOString())")
          )
          PY

          bun install --frozen-lockfile
          set +e
          bun run typecheck
          status=$?
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'fix(types): finalize strict TypeScript cleanup'
            git push
          fi
          exit $status
