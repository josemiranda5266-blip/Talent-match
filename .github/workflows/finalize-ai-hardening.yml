name: Finalize AI hardening

on:
  push:
    branches: [production-hardening]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production-hardening
          fetch-depth: 1

      - name: Remove stale AI fallback responses
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server.ts')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r"const ai=getGeminiClient\(\);if\(!ai\)\{.*?\}const prompt=",
              "const ai=getGeminiClient();if(!ai)return res.status(503).json({error:'La IA no está configurada en el servidor.'});const prompt=",
              text,
              flags=re.S,
          )
          text = re.sub(
              r"\nfunction aiFallbackProfile\(a:any\)\{.*?\}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          path.write_text(text, encoding='utf-8')

          if 'aiFallbackProfile' in text or re.search(r"if\(!ai\)\{", text):
              raise SystemExit('AI fallback code remains in server.ts')

      - name: Build and typecheck
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run typecheck

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git rm .github/workflows/finalize-ai-hardening.yml .github/workflows/remove-ai-fallbacks.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'security: finalize fail-closed AI behavior'
          git push origin HEAD:production-hardening
