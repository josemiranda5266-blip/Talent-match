name: Apply Current Security Audit Corrections
on:
  push:
    branches: [production-hardening]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening
      - name: Patch server security issues
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          s = s.replace("import { requireAuthenticated, requireAdmin, enforceAiBudget, sanitizeAiErrorResponse, markFinancialDataAsModelled, markAnalyticsDataAsModelled } from './runtime-security.ts';", "import { requireAuthenticated, requireAdmin, enforceAiBudget, sanitizeAiErrorResponse, markFinancialDataAsModelled, markAnalyticsDataAsModelled, invalidatePremiumEntitlement } from './runtime-security.ts';")
          s = s.replace("import { requireFirebaseUser, verifyMercadoPagoWebhook, recordWebhookIdempotency, requireMercadoPagoCredential, enforceServerPrice, rejectSimulatedPreferenceResponse, verifyPaymentAgainstMercadoPago, rejectUnimplementedCancellation } from './mercadopago-security.ts';", "import { requireFirebaseUser, verifyMercadoPagoWebhook, recordWebhookIdempotency, requireMercadoPagoCredential, enforceServerPrice, rejectSimulatedPreferenceResponse, verifyPaymentAgainstMercadoPago, rejectUnimplementedCancellation, calculateCouponPrice, resolveCanonicalBasePrice } from './mercadopago-security.ts';")
          s = s.replace("const getGeminiClient=()=>{const apiKey=process.env.GEMINI_API_KEY;if(!apiKey){console.warn('GEMINI_API_KEY process env is missing. AI features will fallback to smart mock heuristic.');return null;}return new GoogleGenAI({apiKey,httpOptions:{headers:{'User-Agent':'aistudio-build'}}});};", "const getGeminiClient=()=>{const apiKey=process.env.GEMINI_API_KEY;if(!apiKey)return null;return new GoogleGenAI({apiKey,httpOptions:{headers:{'User-Agent':'aistudio-build'}}});};")
          s = s.replace("      if(!eventRef)await eventRef.set({processedAt:FieldValue.serverTimestamp(),paymentId:String(payment.id),userId:uid,status:payment.status,amount:transactionAmount},{merge:true});", "      if(!eventRef)await eventRef.set({processedAt:FieldValue.serverTimestamp(),paymentId:String(payment.id),userId:uid,status:payment.status,amount:transactionAmount},{merge:true});")
          # Ensure premium cache is invalidated only after the authoritative user transaction succeeds.
          needle = "    const eventRef=req.mercadoPagoWebhookEventRef;\n    if(eventRef)await eventRef.set({processedAt:FieldValue.serverTimestamp(),paymentId:String(payment.id),userId:uid,status:payment.status,amount:transactionAmount},{merge:true});"
          replacement = "    invalidatePremiumEntitlement(uid);\n    const eventRef=req.mercadoPagoWebhookEventRef;\n    if(eventRef)await eventRef.set({processedAt:FieldValue.serverTimestamp(),paymentId:String(payment.id),userId:uid,status:payment.status,amount:transactionAmount},{merge:true});"
          if needle in s and "invalidatePremiumEntitlement(uid);" not in s:
              s = s.replace(needle, replacement, 1)
          # Remove the insecure HTTP admin-grant endpoint entirely.
          lines = s.splitlines()
          s = '\n'.join(line for line in lines if "app.post('/api/admin/grant-admin'" not in line) + ('\n' if s.endswith('\n') else '')
          # The webhook handler uses FieldValue from firebase-admin/firestore; keep that import explicit.
          if "import { FieldValue } from 'firebase-admin/firestore';" not in s:
              marker = "import * as admin from 'firebase-admin';\n"
              s = s.replace(marker, marker + "import { FieldValue } from 'firebase-admin/firestore';\n", 1)
          p.write_text(s)
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git diff --cached --quiet || git commit -m 'fix(security): remove admin grant endpoint and harden AI fallback'
          git rm .github/workflows/fix-current-security-audit.yml
          git commit -m 'ci: remove one-shot security audit patcher'
          git push origin production-hardening
