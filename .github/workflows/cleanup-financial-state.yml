name: Cleanup financial state

on:
  push:
    branches: [production-hardening]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining synthetic financial state
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('server.ts')
          text=p.read_text(encoding='utf-8')
          text,n=re.subn(r"const financialState:any=\{.*?\};\n", "const financialState:any={incomeMonthlyArs:0,incomeMonthlyUsd:0,currentMonthSpendUsd:{ai:0,firestore:0,storage:0,cloudRun:0,hosting:0,notificationsEmail:0,total:0},todaySpendUsd:{ai:0,firestore:0,storage:0,cloudRun:0,hosting:0,notificationsEmail:0,total:0},totalsCounters:{aiCallsMonth:0,aiTokensMonth:0,firestoreReadsMonth:0,firestoreWritesMonth:0,storageBytesMonth:0,activeFreeUsers:0,activePremiumUsers:0}};\n", text, count=1, flags=re.S)
          print('financialState replacements:',n)
          text=text.replace("revenueGeneratedArs:isPremium?14900:0,netProfitUsd:isPremium?11.46:0", "revenueGeneratedArs:0,netProfitUsd:0")
          old="function getProtectionStatus(){const currentTotal=financialState.currentMonthSpendUsd.total;const budget=budgetConfig.monthlyBudgetUsd;const pct=Math.min(100,Math.round(currentTotal/budget*100));let status:'NORMAL'|'WARNING_50'|'OPTIMIZING_75'|'THROTTLING_90'|'PROTECTION_MODE_100'='NORMAL';if(pct>=100)status='PROTECTION_MODE_100';else if(pct>=90)status='THROTTLING_90';else if(pct>=75)status='OPTIMIZING_75';else if(pct>=50)status='WARNING_50';return{percentageSpent:pct,status,currentSpendUsd:currentTotal,budgetUsd:budget};}"
          new="function getProtectionStatus(){const currentTotal=financialState.currentMonthSpendUsd.total;const budget=budgetConfig.monthlyBudgetUsd;if(!(budget>0))return{percentageSpent:null,status:'NO_DATA',currentSpendUsd:currentTotal,budgetUsd:budget};const pct=Math.min(100,Math.round(currentTotal/budget*100));let status:'NORMAL'|'WARNING_50'|'OPTIMIZING_75'|'THROTTLING_90'|'PROTECTION_MODE_100'='NORMAL';if(pct>=100)status='PROTECTION_MODE_100';else if(pct>=90)status='THROTTLING_90';else if(pct>=75)status='OPTIMIZING_75';else if(pct>=50)status='WARNING_50';return{percentageSpent:pct,status,currentSpendUsd:currentTotal,budgetUsd:budget};}"
          if old in text: text=text.replace(old,new); print('protection guard: replaced')
          else: print('protection guard: not found')
          p.write_text(text,encoding='utf-8')
      - name: Validate
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/cleanup-financial-state.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove remaining synthetic financial state"
          git rm .github/workflows/cleanup-financial-state.yml
          git commit -m "chore: remove temporary financial state cleanup workflow"
          git push
