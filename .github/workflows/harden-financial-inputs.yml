name: Final production hardening

on:
  push:
    branches: [production-hardening]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production-hardening
          fetch-depth: 1

      - name: Apply fail-closed AI and financial validation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server.ts')
          text = path.read_text(encoding='utf-8')

          helper = '''\nfunction finiteNumber(value: unknown): number | null {\n  const n = typeof value === 'number' ? value : Number(value);\n  return Number.isFinite(n) ? n : null;\n}\n\nfunction boundedNumber(value: unknown, min: number, max: number): number | null {\n  const n = finiteNumber(value);\n  return n !== null && n >= min && n <= max ? n : null;\n}\n'''
          if 'function boundedNumber(value: unknown' not in text:
              text = text.replace('const app = express();', helper + '\nconst app = express();', 1)

          # Remove the unused profile fallback and make every AI route fail closed.
          text = re.sub(r'\nfunction aiFallbackProfile\(a:any\)\{.*?\}\n', '\n', text, count=1, flags=re.S)
          text = re.sub(
              r'const ai=getGeminiClient\(\);if\(!ai\).*?const prompt=',
              "const ai=getGeminiClient();if(!ai)return res.status(503).json({error:'La IA no está configurada en el servidor.'});const prompt=",
              text,
              flags=re.S,
          )

          # Replace the financial endpoints atomically, preserving the rest of server.ts.
          reserve = """app.post('/api/financial/reserve-config',(req,res)=>{\n const operationPct=boundedNumber(req.body?.operationPct,0,100);\n const growthPct=boundedNumber(req.body?.growthPct,0,100);\n const emergencyPct=boundedNumber(req.body?.emergencyPct,0,100);\n if(operationPct===null||growthPct===null||emergencyPct===null)return res.status(400).json({error:'Los porcentajes deben ser números entre 0 y 100.'});\n const sum=operationPct+growthPct+emergencyPct;\n if(Math.abs(sum-100)>.1)return res.status(400).json({error:'Los porcentajes deben sumar 100.'});\n reserveFundConfig.operationPct=operationPct;\n reserveFundConfig.growthPct=growthPct;\n reserveFundConfig.emergencyPct=emergencyPct;\n addFinancialAuditLog('REPARTICIÓN_FONDO_RESERVA',`Fondo Inteligente ajustado: ${operationPct}% Operativo, ${growthPct}% Crecimiento, ${emergencyPct}% Emergencia (Intocable).`,0);\n return res.json({success:true,reserveFundConfig,message:'Fondo de Reserva Inteligente actualizado.'});\n});\n"""
          growth = """app.post('/api/financial/simulate-growth',(req,res)=>{\n const additionalUsers=boundedNumber(req.body?.additionalUsers ?? 1000,0,10000000);\n const aiMultiplier=boundedNumber(req.body?.aiMultiplier ?? 1,0,100);\n const firestorePriceMultiplier=boundedNumber(req.body?.firestorePriceMultiplier ?? 1,0,100);\n const conversionRatePct=boundedNumber(req.body?.conversionRatePct ?? 3.5,0,100);\n if(additionalUsers===null||aiMultiplier===null||firestorePriceMultiplier===null||conversionRatePct===null)return res.status(400).json({error:'Parámetros de crecimiento inválidos.'});\n const currentActiveUsers=financialState.totalsCounters.activeFreeUsers+financialState.totalsCounters.activePremiumUsers;\n const newTotalUsers=currentActiveUsers+additionalUsers;\n const estimatedNewPremiumUsers=Math.round(newTotalUsers*(conversionRatePct/100));\n const estimatedMonthlyIncomeUsd=estimatedNewPremiumUsers*14900/1300;\n const projectedAiCostUsd=newTotalUsers*.04*aiMultiplier;\n const projectedDbCostUsd=newTotalUsers*.015*firestorePriceMultiplier;\n const projectedInfraCostUsd=newTotalUsers*.02;\n const projectedTotalCostUsd=projectedAiCostUsd+projectedDbCostUsd+projectedInfraCostUsd;\n const projectedGrossProfitUsd=estimatedMonthlyIncomeUsd-projectedTotalCostUsd;\n const breakEvenUsersNeeded=Math.ceil(projectedTotalCostUsd/(14900/1300));\n const risks:string[]=[];\n const recommendations:string[]=[];\n if(projectedTotalCostUsd>budgetConfig.monthlyBudgetUsd){risks.push(`Supera el presupuesto mensual configurado ($${budgetConfig.monthlyBudgetUsd} USD).`);recommendations.push('Aumentar el límite de presupuesto mensual o activar la paginación estricta.');}\n if(estimatedMonthlyIncomeUsd<projectedTotalCostUsd){risks.push('Escenario con margen negativo (Déficit operacional).');recommendations.push('Mejorar la tasa de conversión a Plan PRO a más del 5% o incrementar el costo del plan.');}else recommendations.push('Escenario altamente rentable. Mantener política actual de caching e IA.');\n res.json({scenario:{additionalUsers,aiMultiplier,firestorePriceMultiplier,conversionRatePct},results:{newTotalUsers,estimatedNewPremiumUsers,projectedMonthlyIncomeUsd:parseFloat(estimatedMonthlyIncomeUsd.toFixed(2)),projectedMonthlyIncomeArs:Math.round(estimatedMonthlyIncomeUsd*1300),projectedCosts:{aiUsd:parseFloat(projectedAiCostUsd.toFixed(2)),firestoreUsd:parseFloat(projectedDbCostUsd.toFixed(2)),storageCloudRunUsd:parseFloat(projectedInfraCostUsd.toFixed(2)),totalUsd:parseFloat(projectedTotalCostUsd.toFixed(2))},projectedGrossProfitUsd:parseFloat(projectedGrossProfitUsd.toFixed(2)),projectedGrossProfitArs:Math.round(projectedGrossProfitUsd*1300),breakEvenUsersNeeded,netProfitMarginPct:estimatedMonthlyIncomeUsd>0?Math.round(projectedGrossProfitUsd/estimatedMonthlyIncomeUsd*100):0,risks,recommendations}});\n});\n"""
          pricing = """app.post('/api/financial/simulate-pricing',(req,res)=>{\n const monthlySubArs=boundedNumber(req.body?.monthlySubArs ?? 14900,1,100000000);\n const annualSubArs=boundedNumber(req.body?.annualSubArs ?? 129000,1,100000000);\n const clubSubArs=boundedNumber(req.body?.clubSubArs ?? 49900,1,100000000);\n const freeAiDailyLimit=boundedNumber(req.body?.freeAiDailyLimit ?? 5,0,100000);\n const projectedSubscribers=boundedNumber(req.body?.projectedSubscribers ?? 50,0,10000000);\n if(monthlySubArs===null||annualSubArs===null||clubSubArs===null||freeAiDailyLimit===null||projectedSubscribers===null)return res.status(400).json({error:'Parámetros de precios inválidos.'});\n const monthlySubUsd=monthlySubArs/1300;\n const estimatedMrrArs=projectedSubscribers*monthlySubArs+(5*clubSubArs);\n const estimatedMrrUsd=estimatedMrrArs/1300;\n const currentTotalCostUsd=financialState.currentMonthSpendUsd.total;\n const netProfitUsd=estimatedMrrUsd-currentTotalCostUsd;\n const breakEvenSubscribers=monthlySubUsd>0?Math.ceil(currentTotalCostUsd/monthlySubUsd):0;\n res.json({pricingConfig:{monthlySubArs,annualSubArs,clubSubArs,freeAiDailyLimit,projectedSubscribers},results:{estimatedMrrArs,estimatedMrrUsd:parseFloat(estimatedMrrUsd.toFixed(2)),currentTotalCostUsd:parseFloat(currentTotalCostUsd.toFixed(2)),netProfitUsd:parseFloat(netProfitUsd.toFixed(2)),netProfitArs:Math.round(netProfitUsd*1300),breakEvenSubscribers,profitMarginPct:estimatedMrrUsd>0?Math.round(netProfitUsd/estimatedMrrUsd*100):0,recommendation:netProfitUsd>0?'Modelo comercial sostenible con alto margen de retorno.':'Revisar precios hacia arriba para asegurar punto de equilibrio.'}});\n});\n"""

          patterns = [
              (r"app\.post\('/api/financial/reserve-config'.*?\n\}\);\n", reserve),
              (r"app\.post\('/api/financial/simulate-growth'.*?\n\}\);\n", growth),
              (r"app\.post\('/api/financial/simulate-pricing'.*?\n\}\);\n", pricing),
          ]
          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'financial endpoint target not found: {pattern}')

          text = text.replace(
              "const period=(req.query.period as string)||'monthly';",
              "const period=String(req.query.period||'monthly');if(!['monthly','quarterly','annual'].includes(period))return res.status(400).json({error:'Período inválido.'});",
              1,
          )

          # Never ship plausible personal email addresses in synthetic financial demo data.
          text = text.replace("lucas.gomez@hotmail.com", "demo.athlete004@synthetic.invalid")
          text = text.replace("mateo.valdez@gmail.com", "demo.athlete002@synthetic.invalid")

          if 'aiFallbackProfile' in text:
              raise SystemExit('aiFallbackProfile remains')
          if re.search(r'const ai=getGeminiClient\(\);if\(!ai\)\{', text):
              raise SystemExit('braced AI fallback remains')
          if 'lucas.gomez@hotmail.com' in text or 'mateo.valdez@gmail.com' in text:
              raise SystemExit('personal-looking demo email remains')

          path.write_text(text, encoding='utf-8')

      - name: Build and typecheck
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run typecheck

      - name: Commit hardened server and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git rm .github/workflows/harden-financial-inputs.yml
          git rm .github/workflows/finalize-ai-hardening.yml 2>/dev/null || true
          git rm .github/workflows/remove-ai-fallbacks.yml 2>/dev/null || true
          git commit -m 'security: enforce fail-closed AI and financial validation'
          git push origin HEAD:production-hardening
