name: Harden financial routes
on:
  push:
    branches: [production-hardening]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[financial-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require admin for financial API
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old = "app.use('/api/financial/', requireAuthenticated, markFinancialDataAsModelled);"
          new = "app.use('/api/financial/', requireAuthenticated, requireAdmin, markFinancialDataAsModelled);"
          if old not in s:
              raise SystemExit('Expected financial middleware not found; refusing to modify unknown content.')
          p.write_text(s.replace(old, new, 1))
      - name: Remove temporary workflow and commit hardening
        shell: bash
        run: |
          rm -f .github/workflows/financial-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/financial-hardening.yml
          git commit -m "fix: require admin for financial API [financial-hardening]"
          git push
