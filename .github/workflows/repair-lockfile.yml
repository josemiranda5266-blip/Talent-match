name: Repair Bun lockfile

on:
  push:
    branches: [production-hardening]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: repair bun lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Commit lockfile and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/repair-lockfile.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "chore: repair bun lockfile"
          git push
